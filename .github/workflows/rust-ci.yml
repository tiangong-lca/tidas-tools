name: Rust CI

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - contracts/**
      - assets/**
      - migration/**
      - .github/workflows/rust-ci.yml
      - scripts/audit-rust-only.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            family: linux
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            family: linux
          - name: macOS Intel
            runner: macos-15-intel
            family: macos
          - name: macOS Apple Silicon
            runner: macos-15
            family: macos
          - name: Windows x86_64
            runner: windows-2025
            family: windows

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux XML toolchain
        if: matrix.family == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes libxml2-dev libxslt1-dev pkg-config

      - name: Install macOS XML toolchain
        if: matrix.family == 'macos'
        run: |
          brew install libxml2 libxslt pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix libxslt)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Windows XML toolchain
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path -Parent (Get-Command vcpkg).Source
          vcpkg install libxslt:x64-windows-static-md
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_TRIPLET=x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          vcpkg list

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Audit Rust-only active tree
        if: matrix.name == 'Linux x86_64'
        run: scripts/audit-rust-only.sh

      - name: Check executable asset lock
        run: cargo run --locked -p tidas-assets --bin tidas-asset-lock -- check

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --locked --workspace --all-targets
