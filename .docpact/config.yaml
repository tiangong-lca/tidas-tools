version: 1
layout: repo
lastReviewedAt: "2026-07-25"
lastReviewedCommit: "3c51461"
# Issue #120 owns native TIDAS/ILCD validation, semantic indexes, ruleset
# inspection, stable reference extraction and batch contracts, explicit memory
# accounting, and deterministic issue/event spooling while Python remains a
# frozen oracle.

catalog:
  repos:
    - id: tidas-tools
      path: .
      canonicalRepo: tiangong-lca/tidas-tools
      entryDoc: AGENTS.md
      workflowDocs:
        - docs/agents/repo-validation.md
        - docs/agents/repo-architecture.md
        - docs/agents/cli-contract.md
      workspaceIntegrationRequired: true

ownership:
  domains:
    - id: repo-governance-and-docs
      paths:
        include:
          - AGENTS.md
          - README.md
          - README_CN.md
          - .gitattributes
          - .docpact/config.yaml
          - docs/agents/cli-contract.md
          - docs/agents/**
          - migration/**
          - .github/workflows/ai-doc-lint.yml
      ownerRepo: tidas-tools
    - id: tool-runtime
      paths:
        include:
          - Cargo.toml
          - Cargo.lock
          - crates/**
          - contracts/**
          - pyproject.toml
          - src/tidas_tools/convert.py
          - src/tidas_tools/import_lca/**
          - src/tidas_tools/validate.py
          - src/tidas_tools/validation_report.py
          - src/tidas_tools/validation_batch.py
          - src/tidas_tools/reference_extraction.py
          - src/tidas_tools/validation_indexes/**
          - src/tidas_tools/export.py
          - src/tidas_tools/package_versions.py
          - src/tidas_tools/release.py
      ownerRepo: tidas-tools
    - id: packaged-assets
      paths:
        include:
          - assets/**
          - src/tidas_tools/tidas/**
          - src/tidas_tools/eilcd/**
      ownerRepo: tidas-tools
    - id: tests-and-automation
      paths:
        include:
          - tests/**
          - test_data/**
          - scripts/schema_lock.py
          - .github/workflows/ci.yml
          - .github/workflows/rust-ci.yml
          - .github/workflows/dispatch-tidas-sdk-sync.yml
          - .github/workflows/python-package-deploy.yml
      ownerRepo: tidas-tools

    - id: local-docpact-push-gate
      paths:
        include:
          - .githooks/**
          - scripts/docpact
          - scripts/docpact-gate.sh
          - scripts/install-git-hooks.sh
      ownerRepo: tidas-tools

coverage:
  include:
    - .githooks/**
    - scripts/docpact
    - scripts/docpact-gate.sh
    - scripts/install-git-hooks.sh
    - AGENTS.md
    - README.md
    - README_CN.md
    - .gitattributes
    - .docpact/config.yaml
    - docs/agents/cli-contract.md
    - docs/agents/**
    - migration/**
    - Cargo.toml
    - Cargo.lock
    - crates/**
    - contracts/**
    - assets/**
    - pyproject.toml
    - src/tidas_tools/convert.py
    - src/tidas_tools/import_lca/**
    - src/tidas_tools/validate.py
    - src/tidas_tools/validation_report.py
    - src/tidas_tools/validation_batch.py
    - src/tidas_tools/reference_extraction.py
    - src/tidas_tools/validation_indexes/**
    - src/tidas_tools/export.py
    - src/tidas_tools/package_versions.py
    - src/tidas_tools/release.py
    - src/tidas_tools/tidas/**
    - src/tidas_tools/eilcd/**
    - scripts/schema_lock.py
    - tests/**
    - test_data/**
    - .github/workflows/ci.yml
    - .github/workflows/rust-ci.yml
    - .github/workflows/ai-doc-lint.yml
    - .github/workflows/dispatch-tidas-sdk-sync.yml
    - .github/workflows/python-package-deploy.yml
  exclude:
    - .git/**
    - .github/scripts/**
    - .docpact/runs/**
    - .venv/**
    - __pycache__/**
    - "**/__pycache__/**"
    - "*.pyc"
    - build/**
    - dist/**
    - "*.egg-info/**"
    - htmlcov/**
    - .pytest_cache/**
    - .mypy_cache/**

freshness:
  warn_after_commits: 40
  warn_after_days: 60
  critical_after_days: 120

routing:
  intents:
    local-docpact-gate:
      paths:
        - .githooks/pre-push
        - scripts/docpact
        - scripts/docpact-gate.sh
        - scripts/install-git-hooks.sh
    tool-runtime:
      paths:
        - docs/agents/cli-contract.md
        - Cargo.toml
        - Cargo.lock
        - crates/**
        - contracts/**
        - pyproject.toml
        - src/tidas_tools/convert.py
        - src/tidas_tools/import_lca/**
        - src/tidas_tools/validate.py
        - src/tidas_tools/validation_report.py
        - src/tidas_tools/validation_batch.py
        - src/tidas_tools/reference_extraction.py
        - src/tidas_tools/validation_indexes/**
        - src/tidas_tools/export.py
        - src/tidas_tools/package_versions.py
        - src/tidas_tools/release.py
    conversion:
      paths:
        - crates/tidas-cli/**
        - crates/tidas-contracts/**
        - crates/tidas-references/**
        - crates/tidas-runtime/**
        - crates/tidas-xml/**
        - src/tidas_tools/convert.py
        - src/tidas_tools/import_lca/**
        - src/tidas_tools/eilcd/**
        - src/tidas_tools/tidas/**
    validation:
      paths:
        - crates/tidas-cli/**
        - crates/tidas-contracts/**
        - crates/tidas-references/**
        - crates/tidas-runtime/**
        - crates/tidas-rulesets/**
        - crates/tidas-validation/**
        - crates/tidas-xml/**
        - contracts/**
        - src/tidas_tools/validate.py
        - src/tidas_tools/validation_report.py
        - src/tidas_tools/validation_batch.py
        - src/tidas_tools/reference_extraction.py
        - src/tidas_tools/validation_indexes/**
        - src/tidas_tools/tidas/schemas/**
        - src/tidas_tools/eilcd/schemas/**
        - src/tidas_tools/tidas/schemas_zh/**
        - src/tidas_tools/tidas/schema.lock.json
        - scripts/schema_lock.py
    export:
      paths:
        - crates/tidas-cli/**
        - crates/tidas-contracts/**
        - crates/tidas-runtime/**
        - src/tidas_tools/export.py
        - src/tidas_tools/package_versions.py
        - src/tidas_tools/release.py
    release-packaging:
      paths:
        - crates/tidas-cli/**
        - crates/tidas-contracts/**
        - crates/tidas-runtime/**
        - crates/tidas-xml/**
        - src/tidas_tools/release.py
        - src/tidas_tools/convert.py
        - src/tidas_tools/validate.py
        - src/tidas_tools/tidas/**
        - src/tidas_tools/eilcd/**
    packaged-assets:
      paths:
        - assets/**
        - crates/tidas-assets/**
        - src/tidas_tools/tidas/**
        - src/tidas_tools/eilcd/**
    sdk-dispatch:
      paths:
        - .github/workflows/dispatch-tidas-sdk-sync.yml
        - src/tidas_tools/tidas/schemas/**
        - src/tidas_tools/tidas/schemas_zh/**
        - src/tidas_tools/tidas/methodologies/**
    release:
      paths:
        - Cargo.toml
        - Cargo.lock
        - .github/workflows/rust-ci.yml
        - pyproject.toml
        - .github/workflows/python-package-deploy.yml
    proof:
      paths:
        - docs/agents/cli-contract.md
        - docs/agents/repo-validation.md
        - Cargo.toml
        - Cargo.lock
        - crates/**
        - contracts/**
        - assets/**
        - migration/**
        - pyproject.toml
        - scripts/schema_lock.py
        - src/tidas_tools/**
        - tests/**
        - test_data/**
        - .github/workflows/ci.yml
        - .github/workflows/rust-ci.yml
        - .github/workflows/dispatch-tidas-sdk-sync.yml
        - .github/workflows/python-package-deploy.yml
    repo-docs:
      paths:
        - AGENTS.md
        - README.md
        - README_CN.md
        - .gitattributes
        - .docpact/config.yaml
        - docs/agents/cli-contract.md
        - docs/agents/**
        - migration/**
    root-integration:
      paths:
        - AGENTS.md

docInventory:
  include:
    - AGENTS.md
    - README.md
    - README_CN.md
    - .docpact/config.yaml
    - docs/agents/cli-contract.md
    - docs/agents/repo-validation.md
    - docs/agents/repo-architecture.md
    - migration/python-to-rust-owners.md

repo:
  id: tidas-tools
  owner: tidas-tools

rules:
  - id: tidas-tools-bootstrap-contract
    scope: repo
    repo: tidas-tools
    triggers:
      - path: AGENTS.md
        kind: doc-contract
      - path: .docpact/config.yaml
        kind: doc-ai-layer
      - path: docs/agents/repo-validation.md
        kind: deep-doc
      - path: docs/agents/repo-architecture.md
        kind: deep-doc
      - path: docs/agents/cli-contract.md
        kind: cli-contract
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
      - path: docs/agents/cli-contract.md
        mode: review_or_update
    reason: Repo entry guidance, machine-readable routing, and retained source docs must stay aligned.
  - id: tidas-tools-readme-contract
    scope: repo
    repo: tidas-tools
    triggers:
      - path: README.md
        kind: repo-landing
      - path: README_CN.md
        kind: repo-landing
    requiredDocs:
      - path: AGENTS.md
        mode: must_exist
      - path: .docpact/config.yaml
        mode: must_exist
      - path: docs/agents/cli-contract.md
        mode: must_exist
    reason: User-facing landing docs should stay aligned with the current repo contract and CLI/release surface.
  - id: tidas-tools-runtime-contract
    scope: repo
    repo: tidas-tools
    triggers:
      - path: Cargo.toml
        kind: rust-workspace
      - path: Cargo.lock
        kind: dependency-lock
      - path: crates/**
        kind: rust-tooling
      - path: contracts/**
        kind: machine-contract
      - path: migration/**
        kind: migration-contract
      - path: pyproject.toml
        kind: runtime-config
      - path: src/tidas_tools/convert.py
        kind: tooling
      - path: src/tidas_tools/import_lca/**
        kind: tooling
      - path: src/tidas_tools/validate.py
        kind: tooling
      - path: src/tidas_tools/validation_report.py
        kind: tooling
      - path: src/tidas_tools/validation_batch.py
        kind: tooling
      - path: src/tidas_tools/reference_extraction.py
        kind: tooling
      - path: src/tidas_tools/validation_indexes/**
        kind: tooling
      - path: src/tidas_tools/export.py
        kind: tooling
      - path: src/tidas_tools/package_versions.py
        kind: tooling
      - path: src/tidas_tools/release.py
        kind: tooling
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
      - path: docs/agents/cli-contract.md
        mode: review_or_update
    reason: Core standalone tooling changes alter the repo's executable contract and proof expectations.
  - id: tidas-tools-asset-contract
    scope: repo
    repo: tidas-tools
    triggers:
      - path: .gitattributes
        kind: repository-normalization
      - path: assets/**
        kind: asset-lock
      - path: crates/tidas-assets/**
        kind: asset-runtime
      - path: src/tidas_tools/tidas/**
        kind: tidas-asset
      - path: src/tidas_tools/eilcd/**
        kind: eilcd-asset
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Packaged schemas, methodologies, and stylesheets are executable upstream assets and can require downstream SDK follow-up.
  - id: tidas-tools-tests-and-automation-contract
    scope: repo
    repo: tidas-tools
    triggers:
      - path: tests/**
        kind: repo-test
      - path: test_data/**
        kind: repo-fixture
      - path: scripts/schema_lock.py
        kind: automation
      - path: .github/workflows/ci.yml
        kind: automation
      - path: .github/workflows/rust-ci.yml
        kind: automation
      - path: .github/workflows/dispatch-tidas-sdk-sync.yml
        kind: automation
      - path: .github/workflows/python-package-deploy.yml
        kind: automation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Test, fixture, release, and downstream dispatch changes affect future tooling validation and SDK refresh routing.
  - id: tidas-tools-doc-maintenance-contract
    scope: repo
    repo: tidas-tools
    triggers:
      - path: .github/workflows/ai-doc-lint.yml
        kind: automation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Repo-local documentation maintenance automation must stay aligned with the repo contract and governed-doc rules.
  - id: tidas-tools-local-docpact-push-gate
    scope: repo
    repo: tidas-tools
    triggers:
      - path: .githooks/pre-push
        kind: local-git-hook
      - path: scripts/docpact
        kind: local-automation
      - path: scripts/docpact-gate.sh
        kind: local-automation
      - path: scripts/install-git-hooks.sh
        kind: local-automation
    requiredDocs:
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Local push documentation governance gates must stay aligned with repo validation guidance and docpact configuration.
