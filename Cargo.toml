[workspace]
members = [
  "crates/tidas-assets",
  "crates/tidas-cli",
  "crates/tidas-conversion",
  "crates/tidas-contracts",
  "crates/tidas-export",
  "crates/tidas-import",
  "crates/tidas-references",
  "crates/tidas-release",
  "crates/tidas-runtime",
  "crates/tidas-rulesets",
  "crates/tidas-validation",
  "crates/tidas-xml",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/tiangong-lca/tidas-tools"

[workspace.dependencies]
bigdecimal = "0.4.9"
clap = { version = "4.6.4", features = ["derive", "env"] }
clap_complete = "4.6.7"
crossbeam-channel = "0.5.16"
ctrlc = "3.5.2"
encoding_rs = "0.8.35"
flate2 = "1.1.9"
futures-util = "0.3.31"
include_dir = "0.7.4"
jsonschema = { version = "0.40.0", default-features = false }
libxml = "0.3.16"
libxslt = "0.1.5"
noyalib = { version = "0.0.16", default-features = false, features = ["std", "compat-serde-yaml"] }
object_store = { version = "0.14.1", default-features = false, features = ["aws"] }
quick-xml = "0.41.0"
regex = "1.12.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.49.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14.0", features = ["aws-lc-rs", "native-certs"] }
walkdir = "2.5.0"
uuid = { version = "1.23.3", features = ["v5"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
